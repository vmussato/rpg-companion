<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="void-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080f"/>
      <stop offset="100%" stop-color="#1a0a20"/>
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="40%" r="20%">
      <stop offset="0%" stop-color="#c4a35a" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b2060" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="800" height="400" fill="url(#void-sky)"/>
  <!-- Stars -->
  <circle cx="80" cy="40" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="200" cy="70" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="350" cy="30" r="1" fill="#fff" opacity="0.4"/>
  <circle cx="550" cy="50" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="680" cy="80" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="750" cy="30" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="150" cy="110" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="620" cy="25" r="1" fill="#fff" opacity="0.4"/>
  <!-- Portal glow -->
  <circle cx="400" cy="160" r="160" fill="url(#portal)"/>
  <ellipse cx="400" cy="160" rx="50" ry="70" fill="none" stroke="#c4a35a" stroke-width="1.5" opacity="0.15"/>
  <ellipse cx="400" cy="160" rx="35" ry="50" fill="none" stroke="#c4a35a" stroke-width="1" opacity="0.1"/>
  <!-- Ruined tower silhouettes -->
  <rect x="180" y="250" width="20" height="80" fill="#0a0a14"/>
  <rect x="175" y="245" width="30" height="10" fill="#0a0a14"/>
  <polygon points="178,245 190,220 202,245" fill="#0a0a14"/>
  <rect x="195" y="270" width="15" height="10" fill="#0a0a14" transform="rotate(-15 202 275)"/>
  <rect x="580" y="240" width="25" height="90" fill="#0a0a14"/>
  <rect x="573" y="233" width="39" height="12" fill="#0a0a14"/>
  <polygon points="577,233 592,200 608,233" fill="#0a0a14"/>
  <!-- Floating debris -->
  <rect x="300" y="200" width="15" height="8" fill="#0a0a14" transform="rotate(20 307 204)"/>
  <rect x="480" y="180" width="12" height="6" fill="#0a0a14" transform="rotate(-10 486 183)"/>
  <!-- Ground -->
  <polygon points="0,330 100,310 200,325 350,300 500,320 650,305 800,330 800,400 0,400" fill="#0a0a14"/>
  <!-- Foreground rocks/ruins -->
  <polygon points="0,360 40,330 80,350 100,340 130,360 130,400 0,400" fill="#070710"/>
  <polygon points="680,350 710,325 740,345 770,330 800,355 800,400 680,400" fill="#070710"/>
  <!-- Mysterious rune glow on ground -->
  <circle cx="400" cy="350" r="3" fill="#c4a35a" opacity="0.2"/>
  <circle cx="400" cy="350" r="8" fill="#c4a35a" opacity="0.05"/>
</svg>
