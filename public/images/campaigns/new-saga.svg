<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="dawn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="70%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#2a1a20"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#dawn-sky)"/>
  <!-- Stars fading -->
  <circle cx="120" cy="40" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="300" cy="60" r="1" fill="#fff" opacity="0.2"/>
  <circle cx="600" cy="35" r="1.5" fill="#fff" opacity="0.3"/>
  <circle cx="500" cy="80" r="1" fill="#fff" opacity="0.2"/>
  <!-- Horizon glow -->
  <ellipse cx="400" cy="280" rx="400" ry="80" fill="#c4a35a" opacity="0.04"/>
  <ellipse cx="400" cy="280" rx="250" ry="50" fill="#c4a35a" opacity="0.03"/>
  <!-- Rolling hills silhouette -->
  <path d="M0,320 Q100,270 200,290 Q300,310 400,280 Q500,250 600,270 Q700,290 800,260 L800,400 L0,400 Z" fill="#0f0f20" opacity="0.7"/>
  <!-- Path/road -->
  <path d="M380,400 Q390,350 400,300 Q410,280 420,270" fill="none" stroke="#1a1a30" stroke-width="8" opacity="0.5"/>
  <path d="M382,400 Q392,350 402,300 Q412,280 420,272" fill="none" stroke="#c4a35a" stroke-width="1" opacity="0.08"/>
  <!-- Lone traveler silhouette -->
  <circle cx="405" cy="295" r="4" fill="#0a0a18"/>
  <line x1="405" y1="299" x2="405" y2="315" stroke="#0a0a18" stroke-width="3"/>
  <line x1="405" y1="305" x2="398" y2="310" stroke="#0a0a18" stroke-width="2"/>
  <line x1="405" y1="305" x2="412" y2="312" stroke="#0a0a18" stroke-width="2"/>
  <line x1="405" y1="315" x2="399" y2="325" stroke="#0a0a18" stroke-width="2"/>
  <line x1="405" y1="315" x2="411" y2="325" stroke="#0a0a18" stroke-width="2"/>
  <!-- Walking stick -->
  <line x1="412" y1="300" x2="418" y2="325" stroke="#0a0a18" stroke-width="1.5"/>
  <!-- Foreground -->
  <polygon points="0,370 80,350 160,365 250,355 350,370 450,360 550,372 650,358 750,368 800,360 800,400 0,400" fill="#080814"/>
</svg>
