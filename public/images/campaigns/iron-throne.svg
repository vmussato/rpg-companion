  <rect x="270" y="190" width="50" height="15" fill="#0a0a1a"/>
  <polygon points="275,190 295,160 315,190" fill="#0a0a1a"/>
  <rect x="340" y="230" width="80" height="90" fill="#0a0a1a"/>
  <rect x="330" y="220" width="100" height="15" fill="#0a0a1a"/>
  <rect x="360" y="280" width="20" height="40" fill="#1a1a3e"/>
  <rect x="440" y="180" width="25" height="140" fill="#0a0a1a"/>
  <rect x="432" y="170" width="41" height="15" fill="#0a0a1a"/>
