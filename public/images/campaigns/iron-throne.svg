  <!-- Trees silhouette -->
  <polygon points="50,350 60,300 70,350" fill="#060612"/>
  <polygon points="80,350 93,290 106,350" fill="#060612"/>
  <polygon points="700,340 715,280 730,340" fill="#060612"/>
  <polygon points="735,340 748,295 761,340" fill="#060612"/>
  <polygon points="760,340 770,310 780,340" fill="#060612"/>
